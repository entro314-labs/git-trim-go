    InstallerSha256: # Update with actual SHA256 from release
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: git-trim.exe
        PortableCommandAlias: git-trim
  - Architecture: arm64
    InstallerType: zip
    InstallerUrl: https://github.com/entro314-labs/git-trim-go/releases/download/v1.0.0/git-trim_1.0.0_windows_arm64.zip
    InstallerSha256: # Update with actual SHA256 from release
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: git-trim.exe
        PortableCommandAlias: git-trim
ManifestType: installer
